name: trex_env
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Base
  - python=3.10
  - pip

  # BLAST and genomics toolchain used across modules
  - blast
  - bedtools
  - parallel

  # Sequence utilities used by satFlank / gene_extractor
  - seqtk
  - seqkit

  # NCBI retrieval used by gene_extractor.sh (efetch/xtract)
  - entrez-direct
  - ncbi-datasets-cli

  # CD-HIT used by monoMiner pipeline (required by cd_hit_filter_size.py workflow)
  - cd-hit

  # Python packages used by arrayScope / satDNA_density
  - numpy
  - pandas
  - matplotlib
  - seaborn
  - biopython
  - parasail

  # Common Unix tools (normalmente já existem, mas garante reprodutibilidade)
  - unzip
  - gawk
  - sed
  - coreutils
  - findutils
